spring.application.name=Turism_APP

# ---------- PostgreSQL ----------
# Значення можна перевизначити змінними середовища DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# Таблиці створює Flyway, Hibernate лише перевіряє, що сутності відповідають таблицям
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Security: 3 користувачі (лаба №5 Multi-user) ----------
# Значення можна перевизначити змінними середовища.
# USER       — лише читання (GET)
app.security.user.username=${USER_USERNAME:user}
app.security.user.password=${USER_PASSWORD:user123}
# ADMIN      — читання, створення і редагування (GET, POST, PUT, PATCH)
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
# SUPERADMIN — повний доступ, зокрема видалення (DELETE)
app.security.superadmin.username=${SUPERADMIN_USERNAME:superadmin}
app.security.superadmin.password=${SUPERADMIN_PASSWORD:superadmin123}
