spring.application.name=Turism_APP

# ---------- PostgreSQL ----------
# Значення можна перевизначити змінними середовища DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# Таблиці створює Flyway, Hibernate лише перевіряє, що сутності відповідають таблицям
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Security (Basic Authorization) ----------
# Користувачі API. Значення можна перевизначити змінними середовища.
# ADMIN — повний доступ (GET, POST, PUT, PATCH, DELETE)
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
# USER — лише читання (GET)
app.security.user.username=${USER_USERNAME:user}
app.security.user.password=${USER_PASSWORD:user123}
